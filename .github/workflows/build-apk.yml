name: Build Malaysia Ghuri APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -q Malaysia_Ghuri_Android_GitHub_Build.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/MalaysiaGhuriAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Malaysia-Ghuri-APK
          path: extracted/MalaysiaGhuriAndroid/app/build/outputs/apk/debug/*.apk
